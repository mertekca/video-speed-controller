<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: sans-serif;
        width: 220px;
        padding: 10px;
      }

      h2 {
        text-align: center;
      }

      .slider-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .value-label {
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: bold;
      }

      input[type=range] {
        width: 100%;
      }

      .presets {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
        margin-top: 10px;
      }

      .preset-btn {
        flex: 1 0 30%;
        max-width: 30%;
        padding: 10px 0;
        font-size: 12px;
        cursor: pointer;
        background: #eee;
        border: 1px solid #ccc;
        border-radius: 4px;
        text-align: center;
        box-sizing: border-box;
      }

      .preset-btn:hover {
        background: #ddd;
      }

      .preset-btn.active {
        background: #007bff;
        color: white;
        font-weight: bold;
      }

      .add-preset-container {
        margin-top: 10px;
        display: flex;
        gap: 5px;
      }

      .add-preset-container input {
        flex: 1;
        padding: 5px;
        font-size: 12px;
      }

      .add-preset-container button {
        padding: 5px;
        font-size: 12px;
        cursor: pointer;
      }

      .error-message {
        color: red;
        font-size: 11px;
        margin-top: 5px;
        text-align: center;
        height: 14px;
      }

      .reset-button {
        margin-top: 10px;
        width: 100%;
        padding: 5px;
        font-size: 12px;
        background: #f44336;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .reset-button:hover {
        background: #d32f2f;
      }
    </style>
  </head>
  <body>
    <h2>Video Speed Controller</h2>

    <div class="slider-container">
      <div class="value-label" id="valueLabel">300%</div>
      <input type="range" id="speedSlider" min="0" max="100" step="0.1" value="47">
    </div>

    <div class="presets" id="presetsContainer"></div>

    <div class="add-preset-container">
      <input type="number" id="newPresetInput" placeholder="Add Preset" min="10" max="1600" />
      <button id="addPresetBtn">+</button>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <button class="reset-button" id="resetPresetsBtn">Reset Presets</button>

    <script src="popup.js"></script>
  </body>
</html>
