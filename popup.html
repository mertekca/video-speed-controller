<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Video Speed Controller</h2>
  <div class="slider-container">
    <div class="value-label" id="valueLabel">100%</div>
    <input type="range" id="speedSlider" min="0" max="100" step="1" value="36">
  </div>

  <div class="presets" id="presetsContainer"></div>

  <div class="add-preset-container">
    <input type="number" id="newPresetInput" placeholder="Add Preset" min="10" max="1600" />
    <button id="addPresetBtn">+</button>
  </div>

  <div class="error-message" id="errorMessage"></div>
  <button class="reset-button" id="resetPresetsBtn">Reset Presets</button>

  <script src="popup.js"></script>
</body>
</html>
